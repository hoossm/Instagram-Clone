<html>

<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <header>
        <div class="container top">
            <img class="logo" src="images/logo.png" alt="">
            <img class="avatar" src="images/user-avatar.png" alt="">
        </div>
    </header>
    <main>
        <section>
            <div class="container">
                <div class="user-info">
                    <img class="usr-avatar" src="images/avatar-vangogh.jpg" alt="">
                    <div class="info">
                        <h1 class="user-name">Vincent van Gogh</h1>
                        <p class="location">Zudert, Netherlands</p>
                    </div>
                </div>
                <div class="post">
                    <img class="post-img" src="images/post-vangogh.jpg" alt="">
                </div>
                <div class="icons">
                    <img class="heart" src="images/icon-heart.png" alt="">
                    <img class="comment" src="images/icon-comment.png" alt="">
                    <img class="dm" src="images/icon-dm.png" alt="">
                </div>
                <div class="engagments">
                    <h2 class="likes-count">21,492 likes</h2>
                    <ul class="comments">
                        <li><span class="user-comment">vincey1853</span> just took a few mushrooms lol</li>
                    </ul>
                </div>


            </div>
        </section>
    </main>

    <script src="index.js"></script>
</body>

</html>
